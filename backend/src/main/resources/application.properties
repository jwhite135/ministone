spring.application.name=backend

# Where employees and shifts are saved (relative to the folder the server is started from).
# Delete this file to reset to sample data.
minishiftsync.data-file=data/shiftsync.json

# Browser origins allowed to call the API (comma-separated). 5173 is the Vite dev server.
minishiftsync.cors.allowed-origins=http://localhost:5173
